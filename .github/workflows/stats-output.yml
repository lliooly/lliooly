name: Generate Profile Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_USERNAME: lliooly
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download stats cards
        run: |
          mkdir -p dist

          curl --fail --location --silent --show-error \
            "https://github-readme-stats.vercel.app/api?username=${GITHUB_USERNAME}&show_icons=true&count_private=true&hide_border=true&theme=default&locale=zh-CN" \
            --output dist/stats-light.svg

          curl --fail --location --silent --show-error \
            "https://github-readme-stats.vercel.app/api?username=${GITHUB_USERNAME}&show_icons=true&count_private=true&hide_border=true&theme=github_dark&locale=zh-CN" \
            --output dist/stats-dark.svg

          curl --fail --location --silent --show-error \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=${GITHUB_USERNAME}&layout=compact&hide_border=true&langs_count=8&theme=default&locale=zh-CN" \
            --output dist/top-langs-light.svg

          curl --fail --location --silent --show-error \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=${GITHUB_USERNAME}&layout=compact&hide_border=true&langs_count=8&theme=github_dark&locale=zh-CN" \
            --output dist/top-langs-dark.svg

      - name: Publish to stats-output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: stats-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
