name: Generate Profile Stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate summary token
        run: |
          if [ -z "${SUMMARY_GITHUB_TOKEN}" ]; then
            echo "::error::Missing repository secret SUMMARY_GITHUB_TOKEN."
            echo "::error::Create a Personal Access Token and save it as SUMMARY_GITHUB_TOKEN in Settings > Secrets and variables > Actions."
            exit 1
          fi
        env:
          SUMMARY_GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}

      - name: Generate and publish summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: lliooly
          BRANCH_NAME: stats-output
          UTC_OFFSET: 8
          AUTO_PUSH: true
